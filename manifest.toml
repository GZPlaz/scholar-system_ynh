#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "scholar-system"
name = "Scholar System"
description.en = "Standards-based assessment, online testing and mastery tracking for universities"
description.fr = "Évaluations par compétences, examens en ligne et suivi de la maîtrise pour les universités"

version = "1.3.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
code = "https://github.com/GZPlaz/scholar-system_ynh"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = true
sso = true
disk = "500M"
ram.build = "300M"
ram.runtime = "350M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/scholar"

    [install.init_main_permission]
    help.en = "Who can reach the staff site (instructors and administrators). Choose 'all_users' if every instructor has a YunoHost account; keep 'visitors' if some sign in with local Scholar accounts. Students never need this: the test portal (/test) is always open to them."
    type = "group"
    default = "visitors"

    [install.admin]
    help.en = "This YunoHost user becomes the first Scholar administrator."
    type = "user"

    [install.institution_name]
    ask.en = "Name of your institution"
    ask.fr = "Nom de votre établissement"
    help.en = "Shown in the interface and on printed tests. Can be changed later in Scholar's settings."
    type = "string"
    default = "MindAccel University"

[resources]
    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    # The integration API (used by the RosarioSIS plugin) authenticates with its own tokens,
    # so the YunoHost portal must let server-to-server requests through.
    api.url = "/api"
    api.allowed = "visitors"
    api.auth_header = false
    api.show_tile = false
    api.protected = true

    # The test portal: students have no YunoHost account (nor a Scholar one), so it is always
    # public; it has its own sign-in (test code + student ID, optional PIN) and session.
    test.url = "/test"
    test.additional_urls = ["/static"]
    test.allowed = "visitors"
    test.auth_header = false
    test.show_tile = false
    test.protected = true

    [resources.ports]
    main.default = 8095

    [resources.apt]
    packages = "python3, python3-venv, python3-pip, postgresql"

    [resources.database]
    type = "postgresql"
