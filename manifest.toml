#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "scholar-system"
name = "Scholar System"
description.en = "Standards-based assessment, online testing and mastery tracking for universities"
description.fr = "Évaluations par compétences, examens en ligne et suivi de la maîtrise pour les universités"

version = "1.8.1~ynh1"

maintainers = []

[upstream]
license = "MIT"
code = "https://github.com/GZPlaz/scholar-system_ynh"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = true
sso = true
disk = "500M"
ram.build = "300M"
ram.runtime = "350M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/scholar"

    [install.admin]
    help.en = "This YunoHost user becomes the first Scholar administrator."
    type = "user"

    [install.institution_name]
    ask.en = "Name of your institution"
    ask.fr = "Nom de votre établissement"
    help.en = "Shown in the interface and on printed tests. Can be changed later in Scholar's settings."
    type = "string"
    default = "MindAccel University"

[resources]
    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    # The site root is the student test portal: students have no YunoHost account, so the main
    # permission is always public. Staff are protected by Scholar's own sign-in (local accounts,
    # YunoHost LDAP or single sign-on).
    main.url = "/"
    main.allowed = "visitors"
    main.protected = true
    main.show_tile = false

    # The staff site, with its own tile in the YunoHost portal. An administrator may restrict it
    # to YunoHost users in the YunoHost admin (then local staff accounts can no longer reach it).
    staff.url = "/staff"
    staff.allowed = "visitors"
    staff.show_tile = true

    # The integration API (used by the RosarioSIS plugin) authenticates with its own tokens,
    # so the YunoHost portal must let server-to-server requests through.
    api.url = "/api"
    api.allowed = "visitors"
    api.auth_header = false
    api.show_tile = false
    api.protected = true

    [resources.ports]
    main.default = 8095

    [resources.apt]
    packages = "python3, python3-venv, python3-pip, postgresql"

    [resources.database]
    type = "postgresql"
