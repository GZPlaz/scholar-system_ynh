name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scholar
          POSTGRES_PASSWORD: scholar
          POSTGRES_DB: scholar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scholar" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r sources/requirements.txt pytest
      - name: Tests (SQLite)
        run: pytest -q tests
      - name: Tests (PostgreSQL)
        run: pytest -q tests
        env:
          SCHOLAR_TEST_DATABASE_URL: postgresql+psycopg2://scholar:scholar@127.0.0.1:5432/scholar_test
      - name: Shell syntax
        run: for f in scripts/*; do bash -n "$f"; done
