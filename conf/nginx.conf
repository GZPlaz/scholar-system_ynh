#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

location __PATH__/static/ {
    alias __INSTALL_DIR__/app/scholar/static/;
    expires 7d;
    more_set_headers "Cache-Control: public";
}

location __PATH__/ {
    # Drop identity headers sent by the client. This runs before SSOwat (rewrite phase vs.
    # access phase), so the only values that reach Scholar are the ones SSOwat sets for
    # users who are really logged into the YunoHost portal.
    more_clear_input_headers "Remote-User" "Ynh-User" "Auth-User" "X-Scholar-User" "X-Scholar-Ynh-User";

    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Scholar-User $http_remote_user;
    proxy_set_header X-Scholar-Ynh-User $http_ynh_user;

    proxy_read_timeout 180s;
    client_max_body_size 25M;

    # Include SSOWAT user panel.
    include conf.d/yunohost_panel.conf.inc;
}
